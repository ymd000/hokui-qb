<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>科目一覧 | 北医QB</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <a href="/quiz" class="header-title">北医QB</a>
    <a href="/logout" class="header-logout">ログアウト</a>
  </header>
  <div class="container">
    <h2>科目一覧</h2>
    <ul class="subject-list" id="subject-list">
      <li>読み込み中...</li>
    </ul>
  </div>
  <script>
    fetch('/api/subjects')
      .then(r => { 
        if (r.status === 401) { location.href = '/login'; throw new Error() }
        if (!r.ok) { location.href = `/quiz`; return; }
        return r.json() 
      })
      .then(subjects => {
        const list = document.getElementById('subject-list')
        list.innerHTML = subjects.map(s => `
          <li class="subject-item">
            <a href="/quiz/${encodeURIComponent(s.subject)}" class="subject-link">
              <span class="subject-name">${s.subject}</span>
              <span class="subject-meta">${s.cohorts.length}期 &nbsp;·&nbsp; ${s.total}問</span>
            </a>
          </li>
        `).join('')
      })
      .catch(() => {})
  </script>
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e09480df6d764a7aa17e74121bf015d2"}'></script>
</body>
</html>
